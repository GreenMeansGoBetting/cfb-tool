<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}CFB Research Hub{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a href="/" class="brand">🏈 CFB Research Hub</a>
  <nav>
    <a href="/">Schedule</a>
    <a href="/teams">Teams</a>
    <a href="/players">Player Leaderboards</a>

<main>

</main>
<footer>
  <p>Data via CollegeFootballData.com &middot; Phase 1 build

</footer>
</body>
</html>
