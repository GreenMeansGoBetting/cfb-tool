{% extends "base.html" %}
{% block title %}Teams{% endblock %}
{% block content %}
<h1>Teams</h1>

<div class="filter-bar">
  <label>Conference:
    <select id="confSelect">
      <option value="">All</option>
      {% for c in conferences %}
      <option value="{{ c }}">{{ c }}</option>
      {% endfor %}
    </select>
  </label>
</div>

<table class="data-table">
  <thead><tr><th>School</th><th>Conference</th><th>Division</th></tr></thead>
  <tbody id="teamsBody">
  {% for t in teams %}
    <tr data-conference="{{ t.conference or '' }}">
      <td><a href="/team/{{ t.team_id }}">{{ t.school }}</a></td>
      <td>{{ t.conference or "—" }}</td>
      <td>{{ t.division or "—" }}</td>
    </tr>
  {% endfor %}
  </tbody>
</table>

<script>
  var confSelect = document.getElementById('confSelect');
  confSelect.addEventListener('change', function () {
    var val = confSelect.value;
    document.querySelectorAll('#teamsBody tr').forEach(function (row) {
      row.style.display = (!val || row.getAttribute('data-conference') === val) ? '' : 'none';
    });
  });
</script>
{% endblock %}
